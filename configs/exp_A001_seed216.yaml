# A-001(s216)：A-001 的 seed 216 复跑 + 训练预算/正则三项覆盖。
#
# 以 `configs/exp_A001.yaml` 为基准（`_base` 继承），按本次要求改三处：
#   train.epochs               8     → 12
#   train.early_stop_patience  2     → 4
#   train.weight_decay         0.01  → 0.02
# 并把随机种子由 42 换成 216（命令行为准：--seed 216，配置内同步写 216 便于复盘）。
# 其余口径逐字段沿用 A-001：ConvNeXt-Tiny fb_in1k、320×320 letterbox、view_weighted 0.7/0.3
# 聚合、BCE + pos_weight、AdamW lr 3e-4、warmup 2 + cosine、batch 16 studies、AMP、grad_clip 5.0。
#
# 用法（在仓库根目录执行）：
#     HF_HUB_OFFLINE=1 .venv/bin/python -u src/run_train.py --config configs/exp_A001_seed216.yaml \
#         --seed 216 --tag A-001_convnext_tiny_s216

_base: exp_A001.yaml

train:
  epochs: 12
  early_stop_patience: 4
  weight_decay: 0.02

seed: 216
