# C-002-b-EXTRA：C-002-b 的短预算复核组。
#
# 以 `configs/exp_C002b.yaml` 为模板逐字段复制，只改两处：
#   1. `train.epochs`: 12 → 8
#   2. `train.early_stop_patience`: 4 → 2
# 其余字段（lr=0.00015、seed=42、cosine、lr_min=1e-5、wd 0.01、batch 16）逐项不变。
#
# 目的：C-002-b 在 12 轮 / patience 4 下 best epoch 4（valid macro-AUC 0.7976），
# 此后 valid_loss 单调反弹到 1.8105，多跑 4 轮属空耗。本组把它拉回 A-001 的
# 8 轮 / patience 2 口径，检验低学习率的结果是否受预算影响。
#
# 完整展开，不使用 `_base`。
#
# 用法（在仓库根目录执行）：
#     HF_HUB_OFFLINE=1 python -u src/run_train.py --config configs/exp_C002b_extra.yaml \
#         --seed 42 --tag C-002-b-EXTRA

data:
  train:
    csv: data/train.csv
    images: data/images/train
  valid:
    csv: data/valid.csv
    images: data/images/valid
  test:
    csv: data/test.csv
    images: data/images/test
  resplit:
    enabled: false
    valid_fraction: 0.1
    seed: 42
image:
  size: 320
  letterbox: true
  normalize: imagenet
  hflip: false
  in_channels: 3
  xrv_maxval: 255
model:
  backbone: convnext_tiny.fb_in1k
  pretrained: true
  num_classes: 10
  dropout: 0.0
  head: standard
  csra_residual_weight: 0.4
  csra_temperature: 1.0
  freeze_backbone: false
  aggregation: view_weighted
  frontal_weight: 0.7
  arch: timm
  xrv_weights: densenet121-res224-all
  xrv_cache_dir: null
  xrv_sha256: null
train:
  epochs: 8
  batch_studies: 16
  lr: 0.00015
  head_lr: null
  weight_decay: 0.01
  pos_weight: true
  warmup_epochs: 2
  lr_scheduler: cosine
  lr_min: 1.0e-05
  amp: true
  grad_clip: 5.0
  num_workers: 16
  tensorboard: auto
  early_stop_patience: 2
  loss: bce
  asl_gamma_pos: 0.0
  asl_gamma_neg: 4.0
  asl_clip: 0.05
eval:
  batch_studies: 32
  threshold: 0.5
output:
  run_dir: outputs
seed: 42
device: auto
