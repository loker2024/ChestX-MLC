# C-002-e：C-002 的学习率上扫组（lr 2×）+ 短 patience。
#
# 以 `configs/exp_C002a.yaml` 为模板逐字段复制，只改两处：
#   1. `train.lr`: 0.0003 → 0.0006（A-001 学习率的 2 倍）
#   2. `train.early_stop_patience`: 4 → 2
# 其余字段（epochs=12、seed=42、cosine、lr_min=1e-5、wd 0.01、batch 16、
# warmup 2）逐项不变。完整展开，不使用 `_base`。
#
# 口径提示：
#   - `lr_min` 固定 1e-5 时 cosine 不是等比放大，lr_floor 由 0.0333 变为 0.0167，
#     即本组除峰值更高外，末段相对衰减也更陡。
#   - 相对 C-002-a，本组同时改了 lr 与 patience，属双变量，不能把差值单独归因于 lr；
#     与 C-002-a 的严格单变量配对仍是 C-002-a vs C-002-b 的既有组。
#
# 用法（在仓库根目录执行）：
#     HF_HUB_OFFLINE=1 python -u src/run_train.py --config configs/exp_C002e.yaml \
#         --seed 42 --tag C-002-e

data:
  train:
    csv: data/train.csv
    images: data/images/train
  valid:
    csv: data/valid.csv
    images: data/images/valid
  test:
    csv: data/test.csv
    images: data/images/test
  resplit:
    enabled: false
    valid_fraction: 0.1
    seed: 42
image:
  size: 320
  letterbox: true
  normalize: imagenet
  hflip: false
  in_channels: 3
  xrv_maxval: 255
model:
  backbone: convnext_tiny.fb_in1k
  pretrained: true
  num_classes: 10
  dropout: 0.0
  head: standard
  csra_residual_weight: 0.4
  csra_temperature: 1.0
  freeze_backbone: false
  aggregation: view_weighted
  frontal_weight: 0.7
  arch: timm
  xrv_weights: null
  xrv_cache_dir: null
  xrv_sha256: null
train:
  epochs: 12
  batch_studies: 16
  lr: 0.0006
  head_lr: null
  weight_decay: 0.01
  pos_weight: true
  warmup_epochs: 2
  lr_scheduler: cosine
  lr_min: 1.0e-05
  amp: true
  grad_clip: 5.0
  num_workers: 16
  tensorboard: auto
  early_stop_patience: 2
  loss: bce
  asl_gamma_pos: 0.0
  asl_gamma_neg: 4.0
  asl_clip: 0.05
eval:
  batch_studies: 32
  threshold: 0.5
output:
  run_dir: outputs
seed: 42
device: auto
