# D-009-a：D-002-a 的唯一变量改动——训练采样按患者检查次数重加权（study_sampler=patient_count），
# 使训练中“多检查患者”study 的期望占比达到 valid 的 66%（571/859，与测试集多检查比例一致）。
# 其余字段与 D-002-a 逐字段相同（seed 42、8 轮、EMA、ema_auc 早停 patience 2）。
# 训练集多检查占比（约 18%）取自 docs/20261104-train-plan-01.md 的分层统计，待首次运行时核对。
# 独立完整配置；timm 架构不读取 xrv_weights。
data:
  train:
    csv: data/train.csv
    images: data/images/train
  valid:
    csv: data/valid.csv
    images: data/images/valid
  test:
    csv: data/test.csv
    images: data/images/test
  resplit:
    enabled: false
    valid_fraction: 0.1
    seed: 42
image:
  size: 320
  letterbox: true
  normalize: imagenet
  hflip: false
  in_channels: 3
  xrv_maxval: 255
  brightness: 0.15
  contrast: 0.15
model:
  backbone: convnext_tiny.fb_in1k
  pretrained: true
  num_classes: 10
  dropout: 0.0
  head: standard
  csra_residual_weight: 0.4
  csra_temperature: 1.0
  freeze_backbone: false
  aggregation: view_weighted
  frontal_weight: 0.7
  arch: timm
  xrv_weights: densenet121-res224-all
  xrv_cache_dir: null
  xrv_sha256: null
train:
  ema_enabled: true
  ema_decay: 0.999
  epochs: 8
  batch_studies: 16
  lr: 0.0003
  head_lr: null
  weight_decay: 0.01
  pos_weight: true
  pos_weight_power: 1.0
  warmup_epochs: 2
  lr_scheduler: cosine
  lr_min: 1.0e-05
  amp: true
  grad_clip: 5.0
  num_workers: 16
  tensorboard: auto
  early_stop_patience: 2
  loss: bce
  study_sampler: patient_count
  study_sampler_threshold: 5
  study_sampler_target_share: 0.665
  asl_gamma_pos: 0.0
  asl_gamma_neg: 4.0
  asl_clip: 0.05
eval:
  batch_studies: 32
  threshold: 0.5
output:
  run_dir: outputs
seed: 42
device: auto
